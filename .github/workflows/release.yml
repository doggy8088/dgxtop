name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release Debian Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debhelper dh-python python3-all python3-setuptools dpkg-dev

      - name: Build Debian Package
        run: |
          dpkg-buildpackage -us -uc -b
          # Create a directory to store the built package for upload
          mkdir -p dist
          # Copy the built .deb package from the parent directory
          cp ../dgxtop_*_all.deb dist/

      - name: Generate Release Tag
        run: |
          # Generate tag using UTC date/time and run ID
          echo "RELEASE_TAG=rel-$(date -u +'%Y%m%d-%H%M%S')-${{ github.run_id }}" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          files: dist/*.deb
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
